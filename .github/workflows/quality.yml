name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# The tool versions CI pins, sha256-checked against each release's published digest. Local runs use
# whatever is installed; scripts/verify.sh reads these and notes a mismatch.
env:
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

# Job names are stable on purpose: a branch ruleset requires checks by name, so renaming a job
# leaves every PR waiting on a check that never reports. scripts/verify.sh runs these same
# commands in this same order (the pre-push hook runs it): add a check to both, or to neither.
jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install
        run: npm ci

      - name: Markdown lint
        run: npm run lint:md

      - name: Spell check
        run: npm run spell

  # The same script verify.sh runs, so both check git's list of Markdown files. A glob of
  # './**/*.md' skipped .github/, since lychee doesn't walk hidden directories without --hidden.
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install lychee
        run: |
          archive="$RUNNER_TEMP/lychee.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lychee" "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/lychee"
          find "$RUNNER_TEMP/lychee" -type f -name lychee -exec install -m 755 {} "$RUNNER_TEMP/bin/" \;
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Internal links (offline)
        run: scripts/check-links.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # The runner's own shellcheck is older and flags what the pinned version accepts.
      - name: Install shellcheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xJf "$archive" -C "$RUNNER_TEMP" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 755 "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # the file list lives in package.json's lint:sh, so it has one home
      - name: Shellcheck (repo scripts, skill scripts, test suites, git hooks)
        run: shellcheck --version && npm run lint:sh

  skill:
    name: skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Pinned by version and by the release's own sha256 (skill-validator_1.6.2_checksums.txt).
      # scripts/check-structure.sh names this version and notes any local mismatch.
      - name: Install skill-validator v1.6.2
        env:
          VERSION: 1.6.2
          SHA256: 2e36e8d2297afed6a0eba854142a2ce94ddae60469d9a4b4ecc6cf9680787a77
        run: |
          archive="$RUNNER_TEMP/skill-validator.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/agent-ecosystem/skill-validator/releases/download/v${VERSION}/skill-validator_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" skill-validator
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Structure
        run: scripts/check-structure.sh

      - name: Content metrics (may hold or rise)
        run: scripts/check-content.sh

      - name: Word budget (may hold or fall)
        run: scripts/check-budget.sh

      - name: Restated values agree
        run: scripts/check-invariants.sh

      - name: Section and file references resolve
        run: scripts/check-section-refs.sh

      - name: Frontmatter
        run: scripts/check-skill-frontmatter.sh

      - name: The checks' own tests
        run: test/checks.test.sh

  # BSD (macOS) and GNU (Linux) userlands both: watchdog.sh probes stat(1) for either,
  # and each leg is the only place its branch runs.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # the suites commit in scratch git repos
      - name: Git identity
        run: git config --global user.email ci@crew.local && git config --global user.name crew-ci

      - name: watchdog.sh
        run: test/watchdog.test.sh

      - name: overlap.sh
        run: test/overlap.test.sh
